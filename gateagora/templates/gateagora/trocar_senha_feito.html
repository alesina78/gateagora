<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Senha alterada — Gate 4</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 2.5rem;
            max-width: 380px;
        }
        .icone { font-size: 2.5rem; margin-bottom: .8rem; }
        h1 { font-size: 1.25rem; margin-bottom: .5rem; }
        p { color: #8b949e; font-size: .88rem; margin-bottom: 1.6rem; }
        a {
            display: inline-block;
            padding: .7rem 1.6rem;
            border-radius: 10px;
            background: #10b981;
            color: #0d1117;
            font-weight: 700;
            text-decoration: none;
        }
        a:hover { background: #0ea371; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icone">✅</div>
        <h1>Senha alterada com sucesso</h1>
        <p>Use a nova senha no seu próximo login.</p>
        <a href="{% url 'dashboard' %}">Voltar ao painel</a>
    </div>
</body>
</html>
